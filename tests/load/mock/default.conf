server {
  listen 80;
  listen [::]:80;
  server_name _;
  client_max_body_size 0;

  location = /files/io.cozy.files.root-dir {
    default_type application/vnd.api+json;
    return 201 '{"data":{"id":"mock-folder","type":"io.cozy.files"}}';
  }

  location = /files/mock-folder {
    if ($request_method = DELETE) {
      return 200;
    }

    default_type application/vnd.api+json;
    return 201 '{"data":{"id":"mock-file","type":"io.cozy.files"}}';
  }

  location = /files/trash/mock-folder {
    return 204;
  }

  location = /sharings/drives/mock-drive/mock-root {
    default_type application/vnd.api+json;
    return 201 '{"data":{"id":"mock-folder","type":"io.cozy.files"}}';
  }

  location = /sharings/drives/mock-drive/mock-folder {
    if ($request_method = DELETE) {
      return 200;
    }

    default_type application/vnd.api+json;
    return 201 '{"data":{"id":"mock-file","type":"io.cozy.files"}}';
  }

  location = /sharings/drives/mock-drive/trash/mock-folder {
    return 204;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
