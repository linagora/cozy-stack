server {
  listen 80;
  listen [::]:80;
  server_name _;
  client_max_body_size 0;

  location = /files/io.cozy.files.root-dir {
    default_type application/vnd.api+json;
    return 201 '{"data":{"id":"mock-file","type":"io.cozy.files"}}';
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
  }
}
