name: Typecheck load tests

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/load-test-types.yml'
      - 'tests/load/**'
  pull_request:
    paths:
      - '.github/workflows/load-test-types.yml'
      - 'tests/load/**'

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/load
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/load/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
