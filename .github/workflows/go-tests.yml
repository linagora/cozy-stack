name: Go tests
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: test (${{ matrix.versions.go-version }}, ${{ matrix.versions.couchdb-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        versions:
          # Maximum supported version
          - go-version: '1.27.x'
            couchdb-version: '3.3.3'
          # Minimum supported version
          - go-version: '1.26.x'
            couchdb-version: '3.2.3'
        shard: [1, 2, 3, 4]
    steps:
      - name: Install CouchDB
        run: |
          curl https://couchdb.apache.org/repo/keys.asc | gpg --dearmor | sudo tee /usr/share/keyrings/couchdb-archive-keyring.gpg
          source /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/couchdb-archive-keyring.gpg] https://apache.jfrog.io/artifactory/couchdb-deb/ ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/couchdb.list
          sudo apt-get update
          sudo debconf-set-selections <<-EOF
                couchdb couchdb/mode select standalone
                couchdb couchdb/mode seen true
                couchdb couchdb/bindaddress string 127.0.0.1
                couchdb couchdb/bindaddress seen true
                couchdb couchdb/adminpass password password
                couchdb couchdb/adminpass seen true
                couchdb couchdb/adminpass_again password password
                couchdb couchdb/adminpass_again seen true
                couchdb couchdb/cookie string elmo
                couchdb couchdb/cookie seen true
          EOF
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --force-yes couchdb=${{ matrix.versions.couchdb-version }}*
          echo "COZY_COUCHDB_URL=http://admin:password@localhost:5984/" >> $GITHUB_ENV

      - name: Install ghostscript
        run: sudo apt install ghostscript

      - name: Change ImageMagick security policy
        run: sudo rm /etc/ImageMagick-6/policy.xml

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shard selection
        run: scripts/go-test-shard-test.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.versions.go-version }}
          cache: true

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          scripts/go-test-shard.sh ${{ matrix.shard }} -json -count=1 | tee go-tests-${{ matrix.shard }}.json

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-${{ matrix.versions.go-version }}-shard-${{ matrix.shard }}
          path: go-tests-${{ matrix.shard }}.json
