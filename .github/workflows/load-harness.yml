name: Load harness
on:
  push:
    branches:
      - master
    paths:
      - 'tests/load/**'
      - '.github/workflows/load-harness.yml'
  pull_request:
    paths:
      - 'tests/load/**'
      - '.github/workflows/load-harness.yml'
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/load
    steps:
      - uses: actions/checkout@v4
      - name: Node tests and typecheck in the Compose Node image
        run: make node-checks
      - name: Compose configuration
        run: make config
      # Only generates the mock upload file: the checks above run in the pinned image. Exact, as
      # the runner's cached 22.x can be older than package.json engines allows.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Mock upload lifecycle
        run: make upload-smoke EXECUTION_ID=ci-smoke
      - name: Collect Compose logs
        if: failure()
        run: docker compose logs --no-color > data/results/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: load-harness-results
          path: tests/load/data/results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
